[package]
name = "kagsim"
version = "0.1.0"
edition = "2024"

[lib]
name = "kagsim"
# cdylib for the Python extension module; rlib so `cargo test` can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rayon = "1.12.0"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
